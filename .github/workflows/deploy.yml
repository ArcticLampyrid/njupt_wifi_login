name: Deploy

on:
  push:
    branches: 
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: 
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-release-notes:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npx changelogithub ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--draft' || '--dry'}}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy-win:
    strategy:
      fail-fast: false
      matrix:
        release_name:
          - "win-x86_64"
          - "win-aarch64"
        include:
          - release_name: "win-x86_64"
            rust_target: "x86_64-pc-windows-msvc"
            upx: true
          - release_name: "win-aarch64"
            rust_target: "aarch64-pc-windows-msvc"
            upx: false
    runs-on: windows-latest
    needs: 
    - generate-release-notes
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust_target }}
    - name: Build (Release)
      shell: pwsh
      run: cargo build --release --target ${{ matrix.rust_target }} --verbose
    - name: Compress with UPX
      if: matrix.upx == true
      run: |
        winget install --id=UPX.UPX -e --silent --accept-source-agreements --accept-package-agreements
        Import-Module "$env:ChocolateyInstall/helpers/chocolateyInstaller.psm1"
        Update-SessionEnvironment
        Get-ChildItem -Path "target/${{ matrix.rust_target }}/release" -Filter *.exe | ForEach-Object { upx --best --lzma $_.FullName }
    - name: Package
      shell: pwsh
      run: |
        $version = git describe --tags --dirty --always
        $unpacked_dir = "unpacked/njupt_wifi_login"
        New-Item -ItemType Directory -Force -Path $unpacked_dir
        Copy-Item -Path "target/${{ matrix.rust_target }}/release/*.exe" -Destination $unpacked_dir
        New-Item -ItemType Directory -Force -Path "release"
        7z a -mx=9 -ms=on "release\njupt_wifi_login-${version}-${{ matrix.release_name }}.7z" "unpacked\*"
    - name: Release (GitHub)
      if: github.event_name == 'push' && github.ref_type == 'tag'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        draft: true
        omitBody: true
        artifacts: "release/*"
    - name: Upload Artifact
      if: github.event_name != 'push' || github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: njupt_wifi_login-${{ matrix.release_name }}
        path: release/*
  
  deploy-linux:
    strategy:
      fail-fast: false
      matrix:
        release_name:
          - "linux-x86_64"
          - "linux-aarch64"
          - "linux-riscv64"
        include:
          - release_name: "linux-x86_64"
            rust_target: "x86_64-unknown-linux-gnu"
            dpkg_arch: "amd64"
            dependencies: "libgtk-3-dev"
            upx: true
          - release_name: "linux-aarch64"
            rust_target: "aarch64-unknown-linux-gnu"
            dpkg_arch: "arm64"
            pkgconf_arch: "aarch64-linux-gnu"
            dependencies: "crossbuild-essential-arm64 libgtk-3-dev:arm64"
            toolchain_name: "aarch64-linux-gnu"
            upx: true
          - release_name: "linux-riscv64"
            rust_target: "riscv64gc-unknown-linux-gnu"
            dpkg_arch: "riscv64"
            pkgconf_arch: "riscv64-linux-gnu"
            dependencies: "crossbuild-essential-riscv64 libgtk-3-dev:riscv64"
            toolchain_name: "riscv64-linux-gnu"
            upx: false
    runs-on: ubuntu-22.04
    needs: 
    - generate-release-notes
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust_target }}
    - name: Install libgtk
      run: | 
        . /etc/lsb-release
        dpkg_arch="${{ matrix.dpkg_arch }}"
        pkgconf_arch="${{ matrix.pkgconf_arch }}"
        toolchain_name="${{ matrix.toolchain_name }}"
        rust_target="${{ matrix.rust_target }}"
        read -r -a dependencies <<< "${{ matrix.dependencies }}"
        if [ -n "$pkgconf_arch" ]; then
          echo "PKG_CONFIG_PATH=/usr/lib/$pkgconf_arch/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/usr/lib/$pkgconf_arch" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV
        fi
        if [ -n "$toolchain_name" ]; then
          echo "[target.${rust_target}]" >> ~/.cargo/config
          echo "linker = \"${toolchain_name}-gcc\"" >> ~/.cargo/config
          echo "ar = \"${toolchain_name}-ar\"" >> ~/.cargo/config
        fi
        if [ "$dpkg_arch" == "arm64" ] || [ "$dpkg_arch" == "riscv64" ]; then
          native_arch="$(dpkg --print-architecture)"
          sudo sed -Ei "/^deb /{/^deb \\[/! s|^deb |deb [arch=${native_arch}] |}" /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-updates main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-updates universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-updates multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-security main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-security universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=$dpkg_arch] http://ports.ubuntu.com/ubuntu-ports $DISTRIB_CODENAME-security multiverse" | sudo tee -a /etc/apt/sources.list
        fi
        sudo dpkg --add-architecture $dpkg_arch
        sudo apt update
        sudo apt install -y aptitude
        aptitude_options=()
        for package in "${dependencies[@]}"; do
          aptitude_options+=(-o "Aptitude::ProblemResolver::Hints::=reject ${package%%:*} :UNINST")
        done
        sudo aptitude install -y --without-recommends \
          -o "Aptitude::ProblemResolver::SolutionCost=removals, safety, priority" \
          "${aptitude_options[@]}" "${dependencies[@]}"
        for package in "${dependencies[@]}"; do
          test "$(dpkg-query -W -f='${db:Status-Abbrev}' "$package")" = "ii "
        done
    - name: Build (Release)
      run: cargo build --release --target ${{ matrix.rust_target }} --verbose
    - name: Compress with UPX
      if: matrix.upx == true
      run: |
        cat << EOF | docker run -i --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:latest bash -e
          dnf install -y upx
          upx --best --lzma "target/${{ matrix.rust_target }}/release/njupt_wifi_login"
          upx --best --lzma "target/${{ matrix.rust_target }}/release/njupt_wifi_login_configurator"
        EOF
    - name: Package
      run: |
        rust_target='${{ matrix.rust_target }}'
        version=$(git describe --tags --dirty --always)
        unpacked_dir=unpacked/njupt_wifi_login
        mkdir -p $unpacked_dir
        cp target/$rust_target/release/njupt_wifi_login $unpacked_dir
        cp target/$rust_target/release/njupt_wifi_login_configurator $unpacked_dir
        mkdir -p release
        tar -czf release/njupt_wifi_login-${version}-${{ matrix.release_name }}.tar.gz -C unpacked .
    - name: Release (GitHub)
      if: github.event_name == 'push' && github.ref_type == 'tag'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        draft: true
        omitBody: true
        artifacts: "release/*"
    - name: Upload Artifact
      if: github.event_name != 'push' || github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: njupt_wifi_login-${{ matrix.release_name }}
        path: release/*

  deploy-linux-musl:
    strategy:
      fail-fast: false
      matrix:
        release_name:
          - "linux-x86_64-musl"
          - "linux-aarch64-musl"
          - "linux-riscv64-musl"
        include:
          - release_name: "linux-x86_64-musl"
            host_oci_arch: "amd64"
            target_oci_arch: "amd64"
            sysroot_base: "alpine:3.24"
          - release_name: "linux-aarch64-musl"
            host_oci_arch: "amd64"
            target_oci_arch: "arm64"
            sysroot_base: "alpine:3.24"
          - release_name: "linux-riscv64-musl"
            host_oci_arch: "amd64"
            target_oci_arch: "riscv64"
            sysroot_base: "alpine:3.24"
    runs-on: ubuntu-latest
    needs: 
    - generate-release-notes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.target_oci_arch != 'amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.target_oci_arch }}
      - name: Prepare Alpine Sysroot
        run: |
          container="alpine-${{ matrix.target_oci_arch }}-sysroot-${GITHUB_RUN_ID}"
          sysroot="$RUNNER_TEMP/alpine-sysroot"
          mkdir -p "$sysroot"
          docker run \
            --name "$container" \
            --platform "linux/${{ matrix.target_oci_arch }}" \
            '${{ matrix.sysroot_base }}' sh -e -c '
              apk --no-cache add build-base linux-headers gtk+3.0-dev rust cargo
              mkdir -p /var/lib/build-config
              rustc -vV | sed -n "s/^host: //p" > /var/lib/build-config/rust-target
              rustc -vV | sed -n "s/^release: //p" > /var/lib/build-config/rust-release
              rustc -vV | sed -n "s/^commit-hash: //p" > /var/lib/build-config/rust-commit
              gcc -dumpmachine > /var/lib/build-config/clang-target
              readelf -lW /bin/busybox | sed -n "s@.*Requesting program interpreter: \(.*\)]@\1@p" > /var/lib/build-config/loader
              readelf -hW /bin/busybox | sed -n "s/^ *Machine: *//p" > /var/lib/build-config/elf-machine
              rm -rf /var/cache/apk/* /tmp/* /var/tmp/*
              rm -f /var/log/apk.log
            '
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" | sudo tar --extract --directory "$sysroot" \
            --numeric-owner --same-permissions --delay-directory-restore
          docker rm "$container"
          trap - EXIT

          {
            echo "SYSROOT=$sysroot"
            echo "RUST_TARGET=$(cat "$sysroot/var/lib/build-config/rust-target")"
            echo "RUST_RELEASE=$(cat "$sysroot/var/lib/build-config/rust-release")"
            echo "RUST_COMMIT=$(cat "$sysroot/var/lib/build-config/rust-commit")"
            echo "CLANG_TARGET=$(cat "$sysroot/var/lib/build-config/clang-target")"
            echo "LOADER=$(cat "$sysroot/var/lib/build-config/loader")"
            echo "ELF_MACHINE=$(cat "$sysroot/var/lib/build-config/elf-machine")"
          } >> "$GITHUB_ENV"
      - name: Build (Release)
        run: |
          docker run --rm \
            -e SYSROOT=/sysroot \
            -e RUST_TARGET \
            -e RUST_RELEASE \
            -e RUST_COMMIT \
            -e CLANG_TARGET \
            -e LOADER \
            -e ELF_MACHINE \
            -v "${{ github.workspace }}:/workspace" \
            -v "$SYSROOT:/sysroot:ro" \
            -w /workspace \
            --platform "linux/${{ matrix.host_oci_arch }}" \
            '${{ matrix.sysroot_base }}' sh -e -c '
              apk add --no-cache rust cargo clang lld pkgconf binutils
              test "$(rustc -vV | sed -n "s/^release: //p")" = "$RUST_RELEASE"
              test "$(rustc -vV | sed -n "s/^commit-hash: //p")" = "$RUST_COMMIT"
              cp -a "$SYSROOT/usr/lib/rustlib/$RUST_TARGET" /usr/lib/rustlib/
              cargo_env=$(printf %s "$RUST_TARGET" | tr "[:lower:]-" "[:upper:]_")
              cargo_env_lower=$(printf %s "$RUST_TARGET" | tr - _)
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_ALL_DYNAMIC=1
              export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
              export PKG_CONFIG_LIBDIR="$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig:$SYSROOT/lib/pkgconfig"
              unset PKG_CONFIG_ALL_STATIC PKG_CONFIG_PATH
              export "PKG_CONFIG_SYSROOT_DIR_$cargo_env_lower=$SYSROOT"
              export "PKG_CONFIG_LIBDIR_$cargo_env_lower=$PKG_CONFIG_LIBDIR"
              export "PKG_CONFIG_PATH_$cargo_env_lower="
              export "CC_$cargo_env_lower=clang"
              export "CXX_$cargo_env_lower=clang++"
              export "AR_$cargo_env_lower=ar"
              export "CFLAGS_$cargo_env_lower=--target=$CLANG_TARGET --sysroot=$SYSROOT --gcc-toolchain=$SYSROOT/usr"
              export "CXXFLAGS_$cargo_env_lower=--target=$CLANG_TARGET --sysroot=$SYSROOT --gcc-toolchain=$SYSROOT/usr"
              export "CARGO_TARGET_${cargo_env}_LINKER=clang"
              rustflags="-C target-feature=-crt-static -C link-arg=--target=$CLANG_TARGET -C link-arg=--sysroot=$SYSROOT -C link-arg=--gcc-toolchain=$SYSROOT/usr -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-dynamic-linker,$LOADER -C link-arg=-Wl,-rpath-link,$SYSROOT/lib -C link-arg=-Wl,-rpath-link,$SYSROOT/usr/lib"
              export "CARGO_TARGET_${cargo_env}_RUSTFLAGS=$rustflags"
              cargo build --release --target "$RUST_TARGET" --verbose
            '
      - name: Compress with UPX
        if: matrix.host_oci_arch != matrix.target_oci_arch
        run: |
          docker run -i --rm -e RUST_TARGET -v ${{ github.workspace }}:/workspace -w /workspace fedora:latest bash -e -c '
            dnf install -y upx
            upx --best --lzma target/$RUST_TARGET/release/njupt_wifi_login
            upx --best --lzma target/$RUST_TARGET/release/njupt_wifi_login_configurator
          '
      - name: Package
        run: |
          version=$(git describe --tags --dirty --always)
          unpacked_dir=unpacked/njupt_wifi_login
          mkdir -p $unpacked_dir
          cp target/$RUST_TARGET/release/njupt_wifi_login $unpacked_dir
          cp target/$RUST_TARGET/release/njupt_wifi_login_configurator $unpacked_dir
          mkdir -p release
          tar -czf release/njupt_wifi_login-${version}-${{ matrix.release_name }}.tar.gz -C unpacked .
      - name: Release (GitHub)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          omitBody: true
          artifacts: "release/*"
      - name: Upload Artifact
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: njupt_wifi_login-${{ matrix.release_name }}
          path: release/*

  publish-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-slim
    needs:
    - deploy-win
    - deploy-linux
    - deploy-linux-musl
    steps:
      - name: Release (GitHub)
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          omitBody: true
