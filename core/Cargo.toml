[package]
edition = "2021"
name = "njupt_wifi_login"
version = "0.7.1"

[features]
default = ["windows-service-mode"]
windows-service-mode = ["dep:windows-service"]

[dependencies]
byte-unit = {version = "5", features = ["serde"]}
chrono = "0.4"
clap = {version = "4.5", features = ["derive"]}
display-error-chain = "0.2"
log = "0.4"
log4rs = { version = "1.4", default-features = false, features = [
  "rolling_file_appender",
  "compound_policy",
  "size_trigger",
  "fixed_window_roller",
] }
network-interface = "2"
njupt_wifi_login_configuration = {path = "../configuration"}
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots"
] }
serde = {version = "1", features = ["derive"]}
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
tokio = {version = "1", features = ["full"]}
hickory-proto = "0.25"
hickory-resolver = "0.25"
windows-service = { version = "0.8", optional = true }
futures-util = "0.3"
rand = "0.10"

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_UI_WindowsAndMessaging",
]
version = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rtnetlink = "0.18"
netlink-sys = "0.8"
netlink-packet-core = "0.8"
netlink-packet-route = "0.25"
daemonize-me = "2.0.2"
